# suppress inspection "UnusedProperty" for whole file

# What is gone with the IntelliJ plugin: ideaVersion, ideaType, instrumentPluginCode - the IDE this
# was compiled against - remoteRobotVersion for the UI tests, fleetRpcVersion for the split-mode
# backend, publishToken and publishChannels for the JetBrains Marketplace, and slackUrl and
# youtrackToken for a release announcement and a tracker that were never this fork's.

version=SNAPSHOT
javaVersion=21
antlrVersion=4.10.1

# Please don't forget to update kotlin version in buildscript section
# Also update kotlinxSerializationVersion version
kotlinVersion=2.3.20

# Kotlinx serialization also uses some version of kotlin stdlib under the hood. However,
#   we exclude this version from the dependency and use our own version of kotlin that is specified above
kotlinxSerializationVersion=1.6.2

# Gradle settings
org.gradle.jvmargs='-Dfile.encoding=UTF-8'
org.gradle.configuration-cache=true
org.gradle.caching=true

# Off, and it has to stay off: `vim-engine` supplies its own collection shims, so turning the
# default on gives it two `HashMap`s and it stops compiling. Modules that need the stdlib ask for
# it, and each one has to: `api` was getting it transitively through a kotlinx-coroutines
# dependency that no source in this repository imports, and asked for nothing itself.
kotlin.stdlib.default.dependency=false

# Disable incremental annotation processing
ksp.incremental=false
# KSP2 is used with java 25: https://github.com/google/ksp/issues/740#issuecomment-2313498615
ksp.useKSP2=true
