# The only live workflow in this fork.
#
# The twenty-eight workflows inherited from IdeaVim were deleted in 146db64f5, so this is the only
# file in this directory. It is here on purpose: a release is the one thing that should not depend
# on which machine it was run from, or on what happened to be in that machine's `dist/` at the time.
#
# It runs on a `vimperor-v*` tag, and it does exactly what `PUBLISHING.md` says to do by hand -
# assemble, package, publish - with the whole test suite in front of it.
#
# What it signs in with depends on what the repository has been given. With `AZURE_CLIENT_ID` and
# `AZURE_TENANT_ID` set as variables it federates to Microsoft Entra ID and holds no secret at all;
# without them it falls back to a `VSCE_PAT` secret, which is the way that stops working in
# December 2026.

name: Publish Vimperor

on:
  push:
    tags:
      - "vimperor-v*"
  # Packaging without publishing, for checking the release path before trusting it with a tag.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the Marketplace as well as packaging"
        type: boolean
        default: false

permissions:
  contents: write
  # For the Entra sign-in below: this is what lets GitHub mint a token saying which repository and
  # which workflow is asking. It is not a credential for anything on its own.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # A tag publishes. A manual run only packages, unless it was asked for both.
      publishing: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      # Java 21 exactly. The build refuses anything else, and says so - this is the same
      # requirement CLAUDE.md states for a developer's machine.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The tag and the manifest have to agree. A tag that says one version and a package that says
      # another is a release nobody can find again, and the Marketplace will happily accept it.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#vimperor-v}"
          declared=$(node -p "require('./vscode-extension/package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "tag says $tagged, package.json says $declared" >&2
            exit 1
          fi

      # Everything, both of the engine's targets, plus the extension's own checks - which `test`
      # alone does not run: the stub-host activation, the two API guards and the command-id guard
      # are `check` tasks. This is the command CLAUDE.md documents, and a release is the wrong
      # moment to be running something narrower than a developer does.
      #
      # It used to exclude `:tests:property-tests` and `:tests:long-running-tests`. Those modules
      # went with the IntelliJ plugin, and `-x` on a project that does not exist is a hard failure -
      # "Cannot locate excluded tasks ... project 'tests' not found" - so this step could not have
      # succeeded since the deletion. No tag has been pushed since, which is the only reason it went
      # unnoticed.
      - name: Test
        run: ./gradlew test :vscode-extension:check --console=plain

      - name: Package
        run: ./gradlew :vscode-extension:packageExtension --console=plain

      # Kept whether or not the publish happens, so that `workflow_dispatch` is a way of getting a
      # `.vsix` to install by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: vimperor-vsix
          path: vscode-extension/build/*.vsix

      # Microsoft Entra ID, by federation rather than by a stored secret: GitHub signs a token
      # saying which repository asked, Azure trades it for an access one, and nothing durable is
      # kept on either side. `AZURE_CLIENT_ID` and `AZURE_TENANT_ID` are repository *variables* and
      # not secrets, deliberately - they name an identity, they do not authenticate as it.
      #
      # Skipped when they are unset, which is the PAT path below. Azure DevOps retires global
      # personal access tokens on 1 December 2026, so that fallback has a date on it; see
      # `vscode-extension/PUBLISHING.md`, including the third way that will make this step
      # unnecessary altogether.
      - name: Sign in to Microsoft Entra ID
        if: env.publishing == 'true' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # Publishing needs a Marketplace membership, not an Azure subscription.
          allow-no-subscriptions: true

      - name: Publish
        if: env.publishing == 'true'
        env:
          # Passed only on the PAT path. `vsce` reads `--pat` before `--azure-credential` and
          # `--pat` defaults to this variable, so a PAT in the environment would quietly win over
          # the sign-in above - and a release that publishes for the wrong reason teaches nothing.
          VSCE_PAT: ${{ vars.AZURE_CLIENT_ID == '' && secrets.VSCE_PAT || '' }}
        run: >
          ./gradlew :vscode-extension:publishExtension
          -PvsceAuth=${{ vars.AZURE_CLIENT_ID != '' && 'entra' || 'pat' }}
          --console=plain

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/build/*.vsix
          body_path: vscode-extension/CHANGELOG.md
