# The only live workflow in this fork.
#
# Everything inherited from JetBrains is disabled by living in `.github/workflows-disabled/` rather
# than here; see the README there. This one is here on purpose: a release is the one thing that
# should not depend on which machine it was run from, or on what happened to be in that machine's
# `dist/` at the time.
#
# It runs on a `vimperor-v*` tag, and it does exactly what `PUBLISHING.md` says to do by hand -
# assemble, package, publish - with the whole test suite in front of it.

name: Publish Vimperor

on:
  push:
    tags:
      - "vimperor-v*"
  # Packaging without publishing, for checking the release path before trusting it with a tag.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the Marketplace as well as packaging"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 21 exactly. The build refuses anything else, and says so - this is the same
      # requirement CLAUDE.md states for a developer's machine.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The tag and the manifest have to agree. A tag that says one version and a package that says
      # another is a release nobody can find again, and the Marketplace will happily accept it.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#vimperor-v}"
          declared=$(node -p "require('./vscode-extension/package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "tag says $tagged, package.json says $declared" >&2
            exit 1
          fi

      # Everything, both hosts. A release is the wrong moment to find out that the engine change
      # that went in last week broke the IntelliJ plugin.
      - name: Test
        run: ./gradlew test -x :tests:property-tests:test -x :tests:long-running-tests:test --console=plain

      - name: Package
        run: ./gradlew :vscode-extension:packageExtension --console=plain

      # Kept whether or not the publish happens, so that `workflow_dispatch` is a way of getting a
      # `.vsix` to install by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: vimperor-vsix
          path: vscode-extension/build/*.vsix

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: ./gradlew :vscode-extension:publishExtension --console=plain

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/build/*.vsix
          body_path: vscode-extension/CHANGELOG.md
